name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  publish:
    # Only publish from main (not on PRs), and only after verify passes.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Monorepo: the published package is the workspace @pubwave/techbrief
      # (packages/cli), not the private root package. Read its version directly.
      - name: Check if version already published
        id: check
        run: |
          NAME=$(node -p "require('./packages/cli/package.json').name")
          LOCAL=$(node -p "require('./packages/cli/package.json').version")
          REMOTE=$(npm view "$NAME@$LOCAL" version 2>/dev/null || echo "")
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "Version $LOCAL already published, skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $LOCAL detected, will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          fi

      # Builds the whole workspace (libs -> server -> web -> CLI). The CLI build
      # bundles the API server and copies the prebuilt web client into the
      # package, so the published tarball is self-contained.
      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      # Authenticated via OIDC trusted publishing (no token). id-token:write lets
      # npm exchange a short-lived GitHub OIDC token for publish rights, and
      # provenance is attached automatically. Configure the trusted publisher for
      # @pubwave/techbrief on npmjs (repo pubwave/techbrief, workflow ci.yml).
      # Tagging + GitHub Release are handled by release.yml after CI succeeds.
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish -w @pubwave/techbrief --access public
