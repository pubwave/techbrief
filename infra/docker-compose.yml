services:
  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 9541
    ports:
      - "9541:9541"
    volumes:
      - techbrief-state:/app/.techbrief

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "9540:80"

volumes:
  techbrief-state:
